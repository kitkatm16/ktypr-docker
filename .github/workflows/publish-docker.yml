name: Build and publish kTYPr Docker

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'New Docker tag (must end in -docker; existing SIF tag is 1.0.1)'
        required: true
        default: '1.0.1-docker'
        type: string
      source_ref:
        description: 'SushiLab/kTYPr commit SHA, branch, or tag (use the SIF source SHA to match it)'
        required: true
        default: 'master'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ktypr-docker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/kitkatm16/ktypr
      IMAGE_TAG: ${{ inputs.image_tag }}
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*-docker$ ]] || { echo 'Tag must end in -docker'; exit 1; }
          [[ ${#IMAGE_TAG} -le 128 ]] || exit 1
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo 'Invalid source ref'; exit 1; }

      - name: Build Linux amd64 image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --platform linux/amd64 \
            --build-arg "KTYPR_REF=$SOURCE_REF" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$IMAGE_TAG" .

      - name: Test as non-root with read-only image filesystem
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --read-only --user 1001:1001 \
            --tmpfs /tmp:rw,exec,mode=1777 --env HOME=/tmp \
            "$IMAGE:$IMAGE_TAG" python /opt/ktypr-build/smoke-test.py

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish tested image
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:$IMAGE_TAG"
          {
            echo '### Published kTYPr Docker image'
            echo "Image: $IMAGE:$IMAGE_TAG"
            echo ''
            echo 'Upstream source commit:'
            docker run --rm "$IMAGE:$IMAGE_TAG" cat /opt/ktypr-build/source-commit.txt
            echo ''
            echo 'Registry digest:'
            docker image inspect --format '{{json .RepoDigests}}' "$IMAGE:$IMAGE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out
        if: always()
        run: docker logout ghcr.io
